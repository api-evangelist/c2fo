aid: c2fo
name: C2FO
description: 'C2FO is a fintech company operating the world''s largest on-demand working
  capital platform, connecting enterprise buyers with their suppliers to enable early
  invoice payment. Through dynamic discounting, supply chain finance, and marketplace-based
  funding, suppliers name the discount rate at which they are willing to be paid early
  while buyers put idle cash to work or free up liquidity. Backed by SoftBank Vision
  Fund and Union Square Ventures, C2FO serves a global network of businesses across
  supply chains. No public developer API or developer portal is currently published;
  this profile captures the company''s public web, security, and legal surface.'
